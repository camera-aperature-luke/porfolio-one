<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — LB Web Development</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header>
    <div class="nav-inner">
      <div class="site-title">
        <a href="index.html">Bultman Web Development</a>
      </div>
      <nav>
        <a href="about.html">about</a>
        <a href="contact.html" class="active">contact</a>
      </nav>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main>

    <div class="page-header">
      <h1>Contact</h1>
    </div>

    <div class="contact-layout">

      <p>
        Have a project in mind or want to say hello? Fill out the form below
        or email me directly at
        <a href="mailto:lukebultman@gmail.com" style="color: var(--color-accent);">
          lukebultman@gmail.com
        </a>.
      </p>

      <!--
        NOTE: This form needs a back-end service to actually send emails.
        Options:
          - Formspree (free tier):  set action="https://formspree.io/f/YOUR_ID"
          - Netlify Forms:          add netlify attribute to the <form> tag
          - EmailJS:                use their JS SDK instead of a form action
      -->
      <form
        class="contact-form"
        action="#"
        method="POST"
      >

        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Tell me about your project…"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-submit">Send message</button>

      </form>
    </div>

  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer>
    &copy; 2026 Bultman Web Development
  </footer>

</body>
</html>
